<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Status - GridCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Promage Warm Sand Palette */
      --bg-app: #ECE7E1;
      --bg-card: #FFFFFF;
      --bg-card-sub: #F6F4EF;
      --border-card: rgba(0, 0, 0, 0.06);
      --border-sub: #E8E4DF;

      --text-main: #141416;
      --text-muted: #71717A;
      --text-dim: #8E8E93;

      --primary-orange: #FF5A26;
      --primary-orange-hover: #E04818;
      --primary-orange-light: #FFF0EB;

      /* Promage Status Colors */
      --emerald-bg: #DEF7EC;
      --emerald-border: #BCF0DA;
      --emerald-text: #03543F;
      --emerald-dot: #10B981;

      --red-bg: #FEE2E2;
      --red-border: #F87171;
      --red-text: #991B1B;
      --red-dot: #EF4444;

      --amber-bg: #FEF3C7;
      --amber-border: #FDE68A;
      --amber-text: #92400E;
      --amber-dot: #F59E0B;

      --blue-bg: #EAF4FE;
      --blue-border: #BFDBFE;
      --blue-text: #1E40AF;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 36px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
      flex: 1;
    }

    /* Promage Top Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo-wrap {
      width: 44px;
      height: 44px;
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      flex-shrink: 0;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
    }

    .header-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--text-main);
      line-height: 1.2;
    }

    .header-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge-refresh {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-admin {
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      background: #0D0D0D;
      border: none;
      padding: 9px 20px;
      border-radius: 9999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-admin:hover {
      background: #262626;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
    }

    /* Promage Hero Operational Banner */
    .hero-banner {
      background: #FFFFFF;
      border-radius: 24px;
      border: 1px solid var(--border-card);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.03);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
      transition: all 0.2s ease;
    }

    .hero-banner-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .hero-icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .hero-operational .hero-icon-wrap {
      background: var(--emerald-bg);
      color: var(--emerald-text);
      border: 1px solid var(--emerald-border);
    }

    .hero-degraded .hero-icon-wrap {
      background: var(--red-bg);
      color: var(--red-text);
      border: 1px solid var(--red-border);
    }

    .hero-content h2 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .hero-content p {
      font-size: 13.5px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .hero-status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .hero-operational .hero-status-pill {
      background: var(--emerald-bg);
      color: var(--emerald-text);
      border: 1px solid var(--emerald-border);
    }

    .hero-degraded .hero-status-pill {
      background: var(--red-bg);
      color: var(--red-text);
      border: 1px solid var(--red-border);
    }

    /* Live Pulse Dot */
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot.dot-up {
      background: var(--emerald-dot);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .pulse-dot.dot-down {
      background: var(--red-dot);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.6);
      animation: pulse 1.4s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    /* Incidents Section */
    .incidents-container {
      margin-bottom: 32px;
    }

    .incident-card {
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid var(--border-card);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.03);
      padding: 20px 24px;
      margin-bottom: 14px;
      border-left: 5px solid;
    }

    .incident-warning {
      border-left-color: var(--primary-orange);
    }

    .incident-critical {
      border-left-color: var(--red-dot);
    }

    .incident-info {
      border-left-color: var(--blue-text);
    }

    .incident-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      gap: 12px;
    }

    .incident-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .incident-time {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-dim);
    }

    .incident-body {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-muted);
    }

    /* Promage Component Groups */
    .group-section {
      margin-bottom: 32px;
    }

    .group-title {
      font-size: 12.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 6px;
    }

    .component-list {
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.03);
    }

    .component-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-sub);
      gap: 20px;
      flex-wrap: wrap;
      transition: background 0.15s ease;
    }

    .component-item:last-child {
      border-bottom: none;
    }

    .component-item:hover {
      background: #FAF8F5;
    }

    .component-left {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 240px;
    }

    .component-squircle {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--bg-card-sub);
      border: 1px solid var(--border-card);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-up {
      background: var(--emerald-dot);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .dot-down {
      background: var(--red-dot);
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.5);
      animation: pulse 1.4s infinite;
    }

    .dot-paused {
      background: var(--amber-dot);
    }

    .component-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .component-sub {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
      font-family: 'JetBrains Mono', monospace;
    }

    .component-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    /* Promage Heartbeat Strip */
    .heartbeat-strip {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .heartbeat-tick {
      width: 5px;
      height: 24px;
      border-radius: 3px;
      background: #E8E4DD;
      position: relative;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .heartbeat-tick:hover {
      transform: scaleY(1.3);
      filter: brightness(1.1);
    }

    .tick-up {
      background: var(--emerald-dot);
    }

    .tick-down {
      background: var(--red-dot);
    }

    .tick-paused {
      background: var(--amber-dot);
    }

    /* Tooltip */
    .heartbeat-tick:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0D0D0D;
      color: #FFFFFF;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      padding: 5px 10px;
      border-radius: 8px;
      white-space: nowrap;
      z-index: 50;
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
    }

    .uptime-percent {
      font-size: 12.5px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      color: var(--text-main);
      background: var(--bg-card-sub);
      border: 1px solid var(--border-card);
      padding: 5px 12px;
      border-radius: 9999px;
    }

    /* Promage Status Badges */
    .badge-status {
      font-size: 11.5px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-up {
      background: var(--emerald-bg);
      border-color: var(--emerald-border);
      color: var(--emerald-text);
    }

    .badge-down {
      background: var(--red-bg);
      border-color: var(--red-border);
      color: var(--red-text);
    }

    .badge-paused {
      background: var(--amber-bg);
      border-color: var(--amber-border);
      color: var(--amber-text);
    }

    /* Footer */
    footer {
      text-align: center;
      font-size: 12.5px;
      color: var(--text-dim);
      padding-top: 40px;
      border-top: 1px solid var(--border-sub);
      margin-top: 40px;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    footer a:hover {
      color: var(--primary-orange);
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .restricted-msg {
      padding: 48px;
      text-align: center;
      background: #FFFFFF;
      border: 1px solid var(--border-card);
      border-radius: 24px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.03);
      color: var(--amber-text);
    }

    @media (max-width: 680px) {
      .header-actions {
        width: 100%;
        justify-content: space-between;
      }
      .hero-banner {
        flex-direction: column;
        align-items: flex-start;
      }
      .component-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }
      .component-right {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-brand">
        <div class="brand-logo-wrap">
          <svg class="brand-icon" viewBox="0 0 32 32" fill="none">
            <circle cx="16" cy="16" r="6" fill="#FF5A26" />
            <path d="M16 2V6M16 26V30M2 16H6M26 16H30M6.1 6.1L8.9 8.9M23.1 23.1L25.9 25.9M6.1 25.9L8.9 23.1M23.1 8.9L25.9 6.1" stroke="#FF5A26" stroke-width="3" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <h1 class="header-title" id="pageTitle">System Status</h1>
          <div class="header-desc" id="pageDesc">Live service and infrastructure telemetry</div>
        </div>
      </div>
      <div class="header-actions">
        <span class="badge-refresh" id="refreshTimer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Auto refresh: --s
        </span>
        <a href="/" class="btn-admin">
          <span>Admin Dashboard</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </header>

    <!-- Promage Hero Operational Banner -->
    <div id="heroBanner" class="hero-banner hero-operational">
      <div class="hero-banner-left">
        <div class="hero-icon-wrap" id="heroIcon">✓</div>
        <div class="hero-content">
          <h2 id="heroHeading">All Systems Operational</h2>
          <p id="heroText">All monitored services, background daemons, and host capacities are running normally.</p>
        </div>
      </div>
      <div class="hero-status-pill">
        <span class="pulse-dot dot-up"></span>
        <span>Live Telemetry</span>
      </div>
    </div>

    <!-- Active Incidents -->
    <div id="incidentsContainer" class="incidents-container" style="display:none;"></div>

    <!-- Component Groups -->
    <div id="groupsContainer">
      <div class="empty-state">Loading status telemetry...</div>
    </div>

    <!-- Footer -->
    <footer>
      <span id="footerText">Powered by GridCore Telemetry</span>
    </footer>
  </div>

  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const slug = (pathParts[0] === 'status' && pathParts[1]) ? pathParts[1] : 'monitor';

    let countdown = 60;
    let refreshIntervalSec = 60;

    async function loadStatus() {
      try {
        const res = await fetch(`/api/status-page/${slug}`);
        if (!res.ok) {
          throw new Error('Failed to load status page');
        }
        const data = await res.json();
        renderStatusPage(data);
      } catch (err) {
        console.error(err);
        document.getElementById('groupsContainer').innerHTML = `
          <div class="empty-state" style="color: var(--red-dot);">
            Failed to connect to monitoring service. Please check back shortly.
          </div>
        `;
      }
    }

    function renderStatusPage(data) {
      if (data.isRestricted) {
        document.getElementById('groupsContainer').innerHTML = `
          <div class="restricted-msg">
            <h3 style="font-size:18px; margin-bottom:8px;">🔒 Access Restricted</h3>
            <p style="font-size: 14px; color: var(--text-muted);">${data.message || 'This status page is private.'}</p>
            <a href="/" class="btn-admin" style="display:inline-flex; margin-top: 18px;">Sign in with Credentials</a>
          </div>
        `;
        document.getElementById('heroBanner').style.display = 'none';
        return;
      }

      document.getElementById('pageTitle').textContent = data.title || 'System Status';
      document.title = `${data.title || 'System Status'} - Status Page`;
      document.getElementById('pageDesc').textContent = data.description || 'Live service and infrastructure telemetry';
      if (data.footerText) {
        document.getElementById('footerText').textContent = data.footerText;
      }

      if (data.refreshInterval) {
        refreshIntervalSec = data.refreshInterval;
        countdown = refreshIntervalSec;
      }

      // Check overall system health across all monitors
      let allMonitors = [];
      if (Array.isArray(data.groupDetails)) {
        data.groupDetails.forEach(g => {
          if (Array.isArray(g.monitors)) {
            allMonitors = allMonitors.concat(g.monitors);
          }
        });
      }

      const totalMonitors = allMonitors.length;
      const downMonitors = allMonitors.filter(m => m.status === 'down');
      const heroBanner = document.getElementById('heroBanner');
      const heroIcon = document.getElementById('heroIcon');
      const heroHeading = document.getElementById('heroHeading');
      const heroText = document.getElementById('heroText');

      if (downMonitors.length === 0) {
        heroBanner.className = 'hero-banner hero-operational';
        heroIcon.textContent = '✓';
        heroHeading.textContent = 'All Systems Operational';
        heroText.textContent = totalMonitors > 0
          ? `All ${totalMonitors} monitored services and host metrics are running normally.`
          : 'All systems are operating normally.';
      } else {
        heroBanner.className = 'hero-banner hero-degraded';
        heroIcon.textContent = '⚠️';
        heroHeading.textContent = `Partial Outage (${downMonitors.length} ${downMonitors.length === 1 ? 'service degraded' : 'services degraded'})`;
        heroText.textContent = 'Our automated telemetry system has detected active incidents on the components listed below.';
      }

      // Render Incidents
      const incidentsContainer = document.getElementById('incidentsContainer');
      if (Array.isArray(data.incidents) && data.incidents.length > 0) {
        incidentsContainer.style.display = 'block';
        incidentsContainer.innerHTML = data.incidents.map(inc => {
          const styleClass = inc.style === 'critical' ? 'incident-critical' : (inc.style === 'info' ? 'incident-info' : 'incident-warning');
          const timeFormatted = inc.createdAt ? new Date(inc.createdAt).toLocaleString() : '';
          return `
            <div class="incident-card ${styleClass}">
              <div class="incident-header">
                <span class="incident-title">${escapeHtml(inc.title)}</span>
                <span class="incident-time">${timeFormatted}</span>
              </div>
              <div class="incident-body">${escapeHtml(inc.content || 'Active service investigation in progress.')}</div>
            </div>
          `;
        }).join('');
      } else {
        incidentsContainer.style.display = 'none';
      }

      // Render Groups & Components
      const groupsContainer = document.getElementById('groupsContainer');
      if (!Array.isArray(data.groupDetails) || data.groupDetails.length === 0) {
        groupsContainer.innerHTML = '<div class="empty-state">No monitored components configured for this status page.</div>';
        return;
      }

      let groupsHtml = '';
      data.groupDetails.forEach(group => {
        const monitors = group.monitors || [];
        groupsHtml += `
          <div class="group-section">
            <div class="group-title">${escapeHtml(group.name || 'Services')}</div>
            <div class="component-list">
              ${monitors.length === 0 ? '<div class="empty-state">No services assigned to this group yet.</div>' : monitors.map(renderComponentItem).join('')}
            </div>
          </div>
        `;
      });
      groupsContainer.innerHTML = groupsHtml;
    }

    function renderComponentItem(m) {
      const isDown = m.status === 'down';
      const isPaused = m.status === 'paused';
      const dotClass = isDown ? 'dot-down' : (isPaused ? 'dot-paused' : 'dot-up');
      const badgeClass = isDown ? 'badge-down' : (isPaused ? 'badge-paused' : 'badge-up');
      const badgeText = isDown ? 'Degraded' : (isPaused ? 'Paused' : 'Operational');

      const heartbeats = m.heartbeats || [];
      const totalSlots = 36;
      const ticks = heartbeats.slice(-totalSlots);
      while (ticks.length < totalSlots) {
        ticks.unshift({ status: 'empty' });
      }

      const stripHtml = ticks.map(t => {
        let tClass = '';
        if (t.status === 'up') tClass = 'tick-up';
        else if (t.status === 'down') tClass = 'tick-down';
        else if (t.status === 'paused') tClass = 'tick-paused';

        const tooltip = t.time ? `${new Date(t.time).toLocaleTimeString()} - ${t.msg || t.status}` : 'No check data';
        return `<div class="heartbeat-tick ${tClass}" data-tooltip="${escapeHtml(tooltip)}"></div>`;
      }).join('');

      const targetText = m.url || (m.target ? `Drive ${m.target}` : (m.type || 'HTTP').toUpperCase());

      return `
        <div class="component-item">
          <div class="component-left">
            <div class="component-squircle">
              <span class="status-dot ${dotClass}"></span>
            </div>
            <div>
              <div class="component-name">${escapeHtml(m.name)}</div>
              <div class="component-sub">${escapeHtml(targetText)}</div>
            </div>
          </div>
          <div class="component-right">
            <div class="heartbeat-strip">${stripHtml}</div>
            <div class="uptime-percent">${m.uptime24h || 100}%</div>
            <span class="badge-status ${badgeClass}">${badgeText}</span>
          </div>
        </div>
      `;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Refresh countdown loop
    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        countdown = refreshIntervalSec;
        loadStatus();
      }
      const el = document.getElementById('refreshTimer');
      if (el) {
        el.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          Auto refresh: ${countdown}s
        `;
      }
    }, 1000);

    // Initial load
    loadStatus();
  </script>
</body>
</html>
